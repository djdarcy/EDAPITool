name: Publish to PyPI

# Trigger only on explicit human action:
#   - Publishing a GitHub Release (UI/API, not just tag push)
#   - Manual workflow dispatch (the "Run workflow" button)
# Tag-push alone does NOT fire this workflow, so creating tags
# during development cannot accidentally publish to PyPI. That matters
# here: this project carries no annotated tags yet, so backfilling them
# would otherwise fire one publish per tag.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Check package
      run: |
        pip install twine
        twine check dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Configured under Settings -> Environments. Trusted publishing on PyPI
    # names this environment, so a protection rule here is what stands
    # between a merged workflow change and an upload.
    environment: pypi

    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    # No API token: PyPI trusted publishing mints a short-lived credential
    # from the OIDC identity of this workflow in this repository.
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
