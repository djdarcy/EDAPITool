name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install flake8

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names.
        # This step carried continue-on-error until 2026-09-09, which meant it
        # could not stop anything -- the comment above described an intention
        # the workflow contradicted one line later.
        flake8 APITool/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Verify import
      run: |
        python -c "from APITool import FrontierAuth, CAPIClient; print('Import OK')"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The 'all' extra pulls dev (pytest, pyyaml) AND gsheets (gspread).
        # The gsheets half is load-bearing: tests/test_gsheet_guard.py carries a
        # module-level skipif on GSPREAD_AVAILABLE, so a bare `pip install -e .`
        # would silently drop 15 tests -- the ones covering the deny-by-default
        # write allowlist -- and CI would still report green.
        pip install -e .[all]

    - name: Run tests
      run: |
        python -m pytest -q

    # The mutation audit (tests/one-offs/mutate.py) deliberately does NOT run
    # here. It rewrites source files in place to check the suite notices, which
    # is fine in a local working tree and wrong in shared CI; it also measures
    # test quality rather than gating correctness. It belongs in the
    # pre-release checklist. Decision recorded 2026-09-09, criterion 6 of #14.

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        pip install twine
        twine check dist/*
