[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edapitool"
dynamic = ["version"]
description = "Elite Dangerous API Tool for fleet carrier inventory extraction and data exploration"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "djdarcy", email = "6962246+djdarcy@users.noreply.github.com"}
]
keywords = [
    "elite-dangerous",
    "capi",
    "companion-api",
    "fleet-carrier",
    "game-data",
    "api-client"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
]
gsheets = [
    "gspread>=5.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
]
all = [
    "edapitool[dev,gsheets]",
]

[project.scripts]
edapitool = "APITool.cli:main"
ed-carrier = "APITool.cli:carrier_main"

[project.urls]
Homepage = "https://github.com/djdarcy/EDAPITool"
Documentation = "https://github.com/djdarcy/EDAPITool#readme"
Repository = "https://github.com/djdarcy/EDAPITool.git"
Issues = "https://github.com/djdarcy/EDAPITool/issues"

[tool.setuptools.dynamic]
version = {attr = "APITool.version.PIP_VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["APITool*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | private
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    "private",
    ".venv",
    "venv",
]
